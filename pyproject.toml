[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "correlation-analysis"
version = "0.1.0"
description = "Correlation structure, factor decomposition and effective bet counting"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["correlation_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
